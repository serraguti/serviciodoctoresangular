<h1>Doctores</h1>

<table class="table table-warning">
    <thead>
        <tr>
            <th>Id</th>
            <th>Apellido</th>
            <th>Especialidad</th>
            <th>Salario</th>
            <th>Hospital</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (doctor of arraydoctores; track doctor){
            <tr>
                <td>{{doctor.idDoctor}}</td>
                <td>{{doctor.apellido}}</td>
                <td>{{doctor.especialidad}}</td>
                <td>{{doctor.salario}}</td>
                <td>{{doctor.idHospital}}</td>
                <td>
                    <button class="btn btn-danger"
                        (click)="eliminarDoctor(doctor.idDoctor)">
                        Delete
                    </button>
                </td>
            </tr>
        }
    </tbody>
</table>
